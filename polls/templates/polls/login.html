<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Code Required</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center">
    <div class="bg-slate-800 border border-slate-700 rounded-lg p-8 max-w-sm w-full">
        <h2 class="text-2xl font-bold text-white text-center mb-6">Enter Access Code</h2>
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label for="access_code" class="block text-white text-sm font-medium mb-2">Access Code</label>
                    <input type="password" name="access_code" id="access_code"
                           class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500"
                           required>
                </div>
                {% if error %}
                    <p class="text-red-400 text-sm">{{ error }}</p>
                {% endif %}
            </div>
            <div class="mt-6">
                <button type="submit"
                        class="w-full px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md">
                    Enter
                </button>
            </div>
        </form>
    </div>
</body>
</html>
