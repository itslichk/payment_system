<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment System Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .product-card.selected {
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.2);
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1f2937;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #374151;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <!-- Header -->
    <header class="border-b border-slate-700 bg-slate-900/50 backdrop-blur-sm">
        <div class="container mx-auto px-2 sm:px-4 md:px-6 py-4">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="h-8 w-8 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 flex items-center justify-center">
                        <i data-lucide="credit-card" class="h-5 w-5 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-white">Payment System Pro</h1>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="refreshData()" class="px-3 py-2 text-sm border border-slate-600 text-slate-300 rounded-md hover:bg-slate-700 flex items-center space-x-2">
                        <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                        <span>Refresh</span>
                    </button>
                    <button onclick="exportUsers()" class="px-3 py-2 text-sm border border-slate-600 text-slate-300 rounded-md hover:bg-slate-700 flex items-center space-x-2">
                        <i data-lucide="download" class="h-4 w-4"></i>
                        <span>Export</span>
                    </button>
                    <button onclick="showToast('Settings dialog coming soon!')" class="px-3 py-2 text-sm border border-slate-600 text-slate-300 rounded-md hover:bg-slate-700 flex items-center space-x-2">
                        <i data-lucide="settings" class="h-4 w-4"></i>
                        <span>Settings</span>
                    </button>
                    <a href="{% url 'logout' %}" class="px-3 py-2 text-sm border border-red-600 text-red-400 rounded-md hover:bg-red-600/20 flex items-center space-x-2">
                        <i data-lucide="log-out" class="h-4 w-4"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
            <div class="mt-2">
                <p class="text-sm text-slate-400">Last action: <span id="lastAction">System initialized</span></p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-2 sm:px-4 md:px-6 py-8">
        <!-- Tabs -->
        <div class="space-y-6">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-1 bg-slate-800 border border-slate-700 rounded-lg p-1">
                <button onclick="switchTab('users')" id="tab-users" class="tab-button flex items-center justify-center space-x-2 px-2 sm:px-4 py-2 rounded-md text-slate-300 hover:bg-slate-700 active">
                    <i data-lucide="users" class="h-4 w-4"></i>
                    <span>Users</span>
                </button>
                <button onclick="switchTab('products')" id="tab-products" class="tab-button flex items-center justify-center space-x-2 px-2 sm:px-4 py-2 rounded-md text-slate-300 hover:bg-slate-700">
                    <i data-lucide="package" class="h-4 w-4"></i>
                    <span>Products</span>
                </button>
                <button onclick="switchTab('payments')" id="tab-payments" class="tab-button flex items-center justify-center space-x-2 px-2 sm:px-4 py-2 rounded-md text-slate-300 hover:bg-slate-700">
                    <i data-lucide="credit-card" class="h-4 w-4"></i>
                    <span>Payments</span>
                </button>
                <button onclick="switchTab('coupons')" id="tab-coupons" class="tab-button flex items-center justify-center space-x-2 px-2 sm:px-4 py-2 rounded-md text-slate-300 hover:bg-slate-700">
                    <i data-lucide="ticket" class="h-4 w-4"></i>
                    <span>Coupons</span>
                </button>
                <button onclick="switchTab('gains')" id="tab-gains" class="tab-button flex items-center justify-center space-x-2 px-2 sm:px-4 py-2 rounded-md text-slate-300 hover:bg-slate-700">
                    <i data-lucide="trending-up" class="h-4 w-4"></i>
                    <span>Gains</span>
                </button>
            </div>

            <!-- Users Tab -->
            <div id="users-content" class="tab-content active">
                <div class="bg-slate-800 border border-slate-700 rounded-lg">
                    <div class="p-4 sm:p-6 border-b border-slate-700">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div>
                                <span class="text-lg text-white font-semibold">Users</span>
                            </div>
                            <button onclick="openModal('addUserModal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                                <i data-lucide="plus" class="h-4 w-4"></i>
                                <span>Add User</span>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 sm:p-6 space-y-4">
                        <div class="relative">
                            <i data-lucide="search" class="absolute left-3 top-3 h-4 w-4 text-slate-400"></i>
                            <input type="text" id="userSearch" placeholder="Search users by name, email or phone..." class="w-full pl-10 pr-3 py-2 bg-slate-700 border border-slate-600 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="rounded-lg border border-slate-700 overflow-x-auto">
                            <table class="w-full min-w-[600px]">
                                <thead>
                                    <tr>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Name</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Email</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Phone</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Total Spent</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Points</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products Tab -->
            <div id="products-content" class="tab-content">
                <div class="bg-slate-800 border border-slate-700 rounded-lg">
                    <div class="p-4 sm:p-6 border-b border-slate-700">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div>
                                <span class="text-lg text-white font-semibold">Products</span>
                            </div>
                            <button onclick="openModal('addProductModal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                                <i data-lucide="plus" class="h-4 w-4"></i>
                                <span>Add Product</span>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 sm:p-6 space-y-4">
                        <div class="relative">
                            <i data-lucide="search" class="absolute left-3 top-3 h-4 w-4 text-slate-400"></i>
                            <input type="text" id="productSearch" placeholder="Search products..." class="w-full pl-10 pr-3 py-2 bg-slate-700 border border-slate-600 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="rounded-lg border border-slate-700 overflow-x-auto">
                            <table class="w-full min-w-[600px]">
                                <thead>
                                    <tr>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Name</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Price</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Description</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="productsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coupons Tab -->
            <div id="coupons-content" class="tab-content">
                <div class="bg-slate-800 border border-slate-700 rounded-lg">
                    <div class="p-4 sm:p-6 border-b border-slate-700">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div>
                                <span class="text-lg text-white font-semibold">Coupons</span>
                            </div>
                            <button onclick="openModal('addCouponModal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                                <i data-lucide="plus" class="h-4 w-4"></i>
                                <span>Add Coupon</span>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 sm:p-6 space-y-4">
                        <div class="rounded-lg border border-slate-700 overflow-x-auto">
                            <table class="w-full min-w-[600px]">
                                <thead>
                                    <tr>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Code</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Discount</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Active</th>
                                        <th class="p-2 sm:p-4 text-left text-slate-400">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="couponsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Payments Tab -->
            <div id="payments-content" class="tab-content">
                <div class="bg-slate-800 border border-slate-700 rounded-lg">
                    <div class="p-4 sm:p-6 border-b border-slate-700">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div>
                                <span class="text-lg text-white font-semibold">Payments</span>
                            </div>
                            <button onclick="openModal('processPaymentModal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                                <i data-lucide="plus" class="h-4 w-4"></i>
                                <span>Process Payment</span>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 sm:p-6">
                        <div class="space-y-4">
                            <div class="text-white font-medium">Recent Payments</div>
                            <div id="recentPayments" class="space-y-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gains Tab -->
            <div id="gains-content" class="tab-content">
                <div class="bg-slate-800 border border-slate-700 rounded-lg">
                    <div class="p-4 sm:p-6 border-b border-slate-700">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div>
                                <span class="text-lg text-white font-semibold">Gains</span>
                            </div>
                            <button onclick="openModal('viewGainsModal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                                <i data-lucide="bar-chart-2" class="h-4 w-4"></i>
                                <span>View Gains</span>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 sm:p-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="p-6 bg-gradient-to-r from-emerald-600 to-teal-600 rounded-lg">
                                <div class="text-white text-lg font-bold" id="totalRevenue">TND 0.00</div>
                                <div class="text-slate-200">Total Revenue</div>
                            </div>
                            <div class="p-6 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-lg">
                                <div class="text-white text-lg font-bold" id="totalTransactions">0</div>
                                <div class="text-slate-200">Total Transactions</div>
                            </div>
                            <div class="p-6 bg-gradient-to-r from-pink-600 to-rose-600 rounded-lg">
                                <div class="text-white text-lg font-bold" id="averageTransaction">TND 0.00</div>
                                <div class="text-slate-200">Average Transaction</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Data storage
        let users = [];
        let products = [];
        let payments = [];
        let coupons = [];
        let selectedProducts = {};

        // Fetch initial data from the server
        async function fetchData() {
            try {
                const usersResponse = await fetch('/api/users/');
                if (!usersResponse.ok) throw new Error(`HTTP error! status: ${usersResponse.status}`);
                users = await usersResponse.json();

                const productsResponse = await fetch('/api/products/');
                if (!productsResponse.ok) throw new Error(`HTTP error! status: ${productsResponse.status}`);
                products = await productsResponse.json();

                const paymentsResponse = await fetch('/api/payments/');
                if (!paymentsResponse.ok) throw new Error(`HTTP error! status: ${paymentsResponse.status}`);
                payments = await paymentsResponse.json();

                const couponsResponse = await fetch('/api/coupons/');
                if (!couponsResponse.ok) throw new Error(`HTTP error! status: ${couponsResponse.status}`);
                coupons = await couponsResponse.json();

                updateAction('Data loaded from server');
                renderAll();
            } catch (error) {
                handleError('Error fetching data', error);
            }
        }

        // Utility functions
        function handleError(message, error) {
            console.error(message + ':', error);
            showToast(`${message}: ${error.message}`);
        }

        function updateAction(message) {
            document.getElementById('lastAction').textContent = message;
            showToast(message);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 3000);
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
            if (modalId === 'processPaymentModal') {
                populatePaymentModal();
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            if (modalId === 'addUserModal') {
                document.getElementById('newUserName').value = '';
                document.getElementById('newUserEmail').value = '';
                document.getElementById('newUserPhone').value = '';
            } else if (modalId === 'addProductModal') {
                document.getElementById('newProductName').value = '';
                document.getElementById('newProductPrice').value = '';
            } else if (modalId === 'addCouponModal') {
                document.getElementById('newCouponCode').value = '';
                document.getElementById('newCouponDiscount').value = '';
            } else if (modalId === 'processPaymentModal') {
                document.getElementById('paymentUser').value = '';
                selectedProducts = {};
                document.getElementById('orderSummary').style.display = 'none';
            }
        }

        function switchTab(tabName) {
            // Remove active class from all tabs and contents
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active', 'bg-emerald-600');
                btn.classList.add('text-slate-300');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Add active class to selected tab and content
            const activeTab = document.getElementById(`tab-${tabName}`);
            activeTab.classList.add('active', 'bg-emerald-600');
            activeTab.classList.remove('text-slate-300');
            document.getElementById(`${tabName}-content`).classList.add('active');

            if (tabName === 'gains') {
                updateGainsStats();
            }
        }

        // User management
        async function addUser() {
            const name = document.getElementById('newUserName').value.trim();
            const email = document.getElementById('newUserEmail').value.trim();
            const phone = document.getElementById('newUserPhone').value.trim();

            if (!name || !email || !phone) {
                showToast('Please fill all fields');
                return;
            }

            try {
                const response = await fetch('/api/users/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ name, email, phone })
                });

                if (response.ok) {
                    const newUser = await response.json();
                    users.push(newUser);
                    closeModal('addUserModal');
                    renderUsers();
                    updateAction(`Added user: ${newUser.name} (${newUser.phone})`);
                } else {
                    showToast('Error adding user');
                }
            } catch (error) {
                handleError('Error adding user', error);
            }
        }

        async function removeUser(userId) {
            const user = users.find(u => u.id == userId);
            try {
                const response = await fetch(`/api/users/${userId}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });

                if (response.ok) {
                    await fetchData();
                    updateAction(`Removed user: ${user?.phone}`);
                } else {
                    showToast('Error removing user');
                }
            } catch (error) {
                handleError('Error removing user', error);
            }
        }

        function viewTransactions(userId) {
            const user = users.find(u => u.id == userId);
            if (!user) return;

            document.getElementById('transactionUserName').textContent = `Viewing transactions for ${user.name}`;
            
            const historyDiv = document.getElementById('transactionHistory');
            if (user.history.length === 0) {
                historyDiv.innerHTML = '<div class="text-center py-8 text-slate-400">No transactions found for this user.</div>';
            } else {
                historyDiv.innerHTML = user.history.map((purchase, index) => `
                    <div class="p-4 bg-slate-700 rounded-lg">
                        <div class="flex justify-between items-start mb-2">
                            <div class="text-white font-medium">Transaction #${index + 1}</div>
                            <div class="text-slate-400 text-sm">${purchase.date}</div>
                        </div>
                        <div class="space-y-1">
                            ${purchase.products.map(product => `
                                <div class="flex justify-between text-slate-300">
                                    <span>${product.name}</span>
                                    <span>TND ${parseFloat(product.price).toFixed(2)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="border-t border-slate-600 mt-2 pt-2 flex justify-between text-white font-bold">
                            <span>Total</span>
                            <span class="text-emerald-400">TND ${parseFloat(purchase.total).toFixed(2)}</span>
                        </div>
                    </div>
                `).join('');

                const totalSpent = user.history.reduce((sum, purchase) => sum + parseFloat(purchase.total), 0);
                historyDiv.innerHTML += `
                    <div class="p-4 bg-emerald-600/20 border border-emerald-600/30 rounded-lg">
                        <div class="text-white font-bold">Grand Total: TND ${totalSpent.toFixed(2)}</div>
                    </div>
                `;
            }

            openModal('viewTransactionsModal');
        }

        function renderUsers() {
            const search = document.getElementById('userSearch').value.toLowerCase();
            const filteredUsers = users.filter(user => 
                user.name.toLowerCase().includes(search) ||
                user.email.toLowerCase().includes(search) ||
                user.phone.includes(search)
            );

            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = filteredUsers.map(user => {
                const totalSpent = user.total_spent;
                return `
                    <tr class="border-b border-slate-700 hover:bg-slate-700/30">
                        <td class="p-4 text-white font-medium">${user.name}</td>
                        <td class="p-4 text-slate-300">${user.email}</td>
                        <td class="p-4 text-slate-300">${user.phone}</td>
                        <td class="p-4 text-emerald-400 font-medium">TND ${parseFloat(totalSpent).toFixed(2)}</td>
                        <td class="p-4 text-white font-medium">${user.points}</td>
                        <td class="p-4">
                            <div class="flex space-x-2">
                                <button onclick="viewTransactions('${user.id}')" class="p-2 border border-slate-600 text-slate-300 rounded hover:bg-slate-700">
                                    <i data-lucide="eye" class="h-4 w-4"></i>
                                </button>
                                <button onclick="openEditUserModal('${user.id}')" class="p-2 border border-slate-600 text-slate-300 rounded hover:bg-slate-700">
                                    <i data-lucide="edit" class="h-4 w-4"></i>
                                </button>
                                <button onclick="removeUser('${user.id}')" class="p-2 border border-red-600 text-red-400 rounded hover:bg-red-600/20">
                                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
            lucide.createIcons();
        }

        function filterUsers() {
            renderUsers();
        }

        function openEditUserModal(userId) {
            const user = users.find(u => u.id == userId);
            if (user) {
                document.getElementById('editUserId').value = user.id;
                document.getElementById('editUserName').value = user.name;
                document.getElementById('editUserEmail').value = user.email;
                document.getElementById('editUserPhone').value = user.phone;
                openModal('editUserModal');
            }
        }

        async function updateUser() {
            const userId = document.getElementById('editUserId').value;
            const name = document.getElementById('editUserName').value.trim();
            const email = document.getElementById('editUserEmail').value.trim();
            const phone = document.getElementById('editUserPhone').value.trim();

            if (!name || !email || !phone) {
                showToast('Please fill all fields');
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ name, email, phone })
                });

                if (response.ok) {
                    const updatedUser = await response.json();
                    const index = users.findIndex(u => u.id == userId);
                    if (index !== -1) {
                        users[index] = updatedUser;
                    }
                    closeModal('editUserModal');
                    renderUsers();
                    updateAction(`Updated user: ${updatedUser.name}`);
                } else {
                    showToast('Error updating user');
                }
            } catch (error) {
                handleError('Error updating user', error);
            }
        }

        // Coupon management
        function generateCouponCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('newCouponCode').value = result;
        }

        async function addCoupon() {
            const code = document.getElementById('newCouponCode').value.trim();
            const discountStr = document.getElementById('newCouponDiscount').value.trim();
            const isPercentage = true;

            if (!code || !discountStr) {
                showToast('Please fill all fields');
                return;
            }

            const discount = parseFloat(discountStr);

            if (isNaN(discount) || discount <= 0) {
                showToast('Please enter a valid discount');
                return;
            }

            try {
                const response = await fetch('/api/coupons/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ code, discount, is_percentage: isPercentage })
                });

                if (response.ok) {
                    const newCoupon = await response.json();
                    coupons.push(newCoupon);
                    closeModal('addCouponModal');
                    renderCoupons();
                    updateAction(`Added coupon: ${newCoupon.code}`);
                } else {
                    const errorData = await response.json();
                    showToast(`Error: ${errorData.detail || 'Failed to add coupon'}`);
                }
            } catch (error) {
                handleError('Error adding coupon', error);
            }
        }

        async function removeCoupon(couponId) {
            const coupon = coupons.find(c => c.id == couponId);
            try {
                const response = await fetch(`/api/coupons/${couponId}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });

                if (response.ok) {
                    await fetchData();
                    updateAction(`Removed coupon: ${coupon?.code}`);
                } else {
                    showToast('Error removing coupon');
                }
            } catch (error) {
                handleError('Error removing coupon', error);
            }
        }

        function renderCoupons() {
            const tbody = document.getElementById('couponsTable');
            tbody.innerHTML = coupons.map(coupon => `
                <tr class="border-b border-slate-700 hover:bg-slate-700/30">
                    <td class="p-4 text-white font-medium">${coupon.code}</td>
                    <td class="p-4 text-emerald-400 font-medium">${coupon.discount}%</td>
                    <td class="p-4 text-slate-300">${coupon.active ? 'Yes' : 'No'}</td>
                    <td class="p-4">
                        <button onclick="removeCoupon('${coupon.id}')" class="p-2 border border-red-600 text-red-400 rounded hover:bg-red-600/20">
                            <i data-lucide="trash-2" class="h-4 w-4"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        // Product management
        async function addProduct() {
            const name = document.getElementById('newProductName').value.trim();
            const priceStr = document.getElementById('newProductPrice').value.trim();
            const description = document.getElementById('newProductDescription').value.trim();

            if (!name || !priceStr) {
                showToast('Please fill all fields');
                return;
            }

            const price = parseFloat(priceStr);

            if (isNaN(price) || price <= 0) {
                showToast('Please enter a valid price');
                return;
            }

            try {
                const response = await fetch('/api/products/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ name, price, description })
                });

                if (response.ok) {
                    const newProduct = await response.json();
                    products.push(newProduct);
                    closeModal('addProductModal');
                    renderProducts();
                    updateAction(`Added product: ${newProduct.name} (TND ${newProduct.price})`);
                } else {
                    showToast('Error adding product');
                }
            } catch (error) {
                handleError('Error adding product', error);
            }
        }

        async function removeProduct(productId) {
            const product = products.find(p => p.id == productId);
            try {
                const response = await fetch(`/api/products/${productId}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });

                if (response.ok) {
                    await fetchData();
                    updateAction(`Removed product: ${product?.name}`);
                } else {
                    showToast('Error removing product');
                }
            } catch (error) {
                handleError('Error removing product', error);
            }
        }

        function renderProducts() {
            const search = document.getElementById('productSearch').value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(search)
            );

            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = filteredProducts.map(product => `
                <tr class="border-b border-slate-700 hover:bg-slate-700/30">
                    <td class="p-4 text-white font-medium">${product.name}</td>
                    <td class="p-4 text-emerald-400 font-medium">TND ${parseFloat(product.price).toFixed(2)}</td>
                    <td class="p-4 text-slate-300">${product.description}</td>
                    <td class="p-4">
                        <div class="flex space-x-2">
                            <button onclick="openEditProductModal('${product.id}')" class="p-2 border border-slate-600 text-slate-300 rounded hover:bg-slate-700">
                                <i data-lucide="edit" class="h-4 w-4"></i>
                            </button>
                            <button onclick="removeProduct('${product.id}')" class="p-2 border border-red-600 text-red-400 rounded hover:bg-red-600/20">
                                <i data-lucide="trash-2" class="h-4 w-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function filterProducts() {
            renderProducts();
        }

        function openEditProductModal(productId) {
            const product = products.find(p => p.id == productId);
            if (product) {
                document.getElementById('editProductId').value = product.id;
                document.getElementById('editProductName').value = product.name;
                document.getElementById('editProductPrice').value = product.price;
                document.getElementById('editProductDescription').value = product.description;
                openModal('editProductModal');
            }
        }

        async function updateProduct() {
            const productId = document.getElementById('editProductId').value;
            const name = document.getElementById('editProductName').value.trim();
            const priceStr = document.getElementById('editProductPrice').value.trim();
            const description = document.getElementById('editProductDescription').value.trim();

            if (!name || !priceStr) {
                showToast('Please fill name and price');
                return;
            }

            const price = parseFloat(priceStr);
            if (isNaN(price) || price <= 0) {
                showToast('Please enter a valid price');
                return;
            }

            try {
                const response = await fetch(`/api/products/${productId}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ name, price, description })
                });

                if (response.ok) {
                    const updatedProduct = await response.json();
                    const index = products.findIndex(p => p.id == productId);
                    if (index !== -1) {
                        products[index] = updatedProduct;
                    }
                    closeModal('editProductModal');
                    renderProducts();
                    updateAction(`Updated product: ${updatedProduct.name}`);
                } else {
                    showToast('Error updating product');
                }
            } catch (error) {
                handleError('Error updating product', error);
            }
        }

        // Payment processing
        function populatePaymentModal() {
            const userSelect = document.getElementById('paymentUser');
            userSelect.innerHTML = '<option value="">Choose a user</option>' +
                users.map(user => `<option value="${user.id}">${user.name} (${user.phone})  PT(${user.points})</option>`).join('');

            const productDiv = document.getElementById('productSelection');
            productDiv.innerHTML = products.map(product => `
                <div id="product-card-${product.id}" class="product-card p-3 rounded-lg border border-slate-600 bg-slate-700 transition-colors">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="text-white font-medium">${product.name}</div>
                            <div class="text-emerald-400">TND ${parseFloat(product.price).toFixed(2)}</div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQuantity('${product.id}', -1)" class="p-1 rounded-md bg-slate-600 hover:bg-slate-500">-</button>
                            <input type="number" id="quantity-${product.id}" value="0" min="0" class="w-12 text-center bg-slate-800 border border-slate-600 rounded-md" oninput="updateQuantityFromInput('${product.id}')">
                            <button onclick="changeQuantity('${product.id}', 1)" class="p-1 rounded-md bg-slate-600 hover:bg-slate-500">+</button>
                        </div>
                    </div>
                </div>
            `).join('');

            selectedProducts = {};
            updateOrderSummary();
        }

        function changeQuantity(productId, delta) {
            const quantityInput = document.getElementById(`quantity-${productId}`);
            let currentQuantity = parseInt(quantityInput.value);
            let newQuantity = currentQuantity + delta;
            if (newQuantity < 0) {
                newQuantity = 0;
            }
            quantityInput.value = newQuantity;
            updateQuantityFromInput(productId);
        }

        function updateQuantityFromInput(productId) {
            const quantityInput = document.getElementById(`quantity-${productId}`);
            const quantity = parseInt(quantityInput.value);
            const card = document.getElementById(`product-card-${productId}`);

            if (quantity > 0) {
                selectedProducts[productId] = quantity;
                card.classList.add('selected');
            } else {
                delete selectedProducts[productId];
                card.classList.remove('selected');
            }
            updateOrderSummary();
        }

        function updateOrderSummary() {
            const summaryDiv = document.getElementById('orderSummary');
            const itemsDiv = document.getElementById('summaryItems');
            const totalSpan = document.getElementById('summaryTotal');
            const productIds = Object.keys(selectedProducts);

            if (productIds.length === 0) {
                summaryDiv.style.display = 'none';
                return;
            }

            let total = 0;
            const userId = document.getElementById('paymentUser').value;
            const user = users.find(u => u.id == userId);
            let remainingPoints = user ? user.points : 0;

            itemsDiv.innerHTML = productIds.map(productId => {
                const product = products.find(p => p.id == productId);
                const quantity = selectedProducts[productId];
                const subtotal = parseFloat(product.price) * quantity;
                let discount = 0;
                if (user && remainingPoints > 0 && document.getElementById('usePoints').checked) {
                    discount = Math.min(remainingPoints, subtotal);
                    remainingPoints -= discount;
                    total += subtotal - discount*0.1;
                } 
                else {
                    total += subtotal;
                }
                return `
                    <div class="flex justify-between text-slate-300">
                        <span>${product.name} x ${quantity}</span>
                        <span>TND ${subtotal.toFixed(2)}</span>
                    </div>
                `;
            }).join('');

            totalSpan.textContent = `TND ${total.toFixed(2)}`;
            summaryDiv.style.display = 'block';
        }

        async function processPayment() {
            const userId = document.getElementById('paymentUser').value;
            const productIds = Object.keys(selectedProducts);

            if (!userId || productIds.length === 0) {
                showToast('Please select a user and at least one product');
                return;
            }

            const user = users.find(u => u.id == userId);
            let total = 0;
            let remainingPoints = user ? user.points : 0;

            const purchasedProducts = productIds.map(productId => {
                const product = products.find(p => p.id == productId);
                const quantity = selectedProducts[productId];
                const subtotal = parseFloat(product.price) * quantity;

                if (remainingPoints > 0 && document.getElementById('usePoints').checked) {
                    const discount = Math.min(remainingPoints, subtotal);
                    total += subtotal - discount;
                    remainingPoints -= discount;
                } else {
                    total += subtotal;
                }

                return {
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: quantity
                };
            });

            const coupon = document.getElementById('couponCode').value.trim();
            const use_points = document.getElementById('usePoints').checked;

            const paymentData = {
                userId,
                products: purchasedProducts,
                total,
                coupon,
                use_points
            };

            try {
                const response = await fetch('/api/payments/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify(paymentData)
                });

                if (response.ok) {
                    await fetchData();
                    closeModal('processPaymentModal');
                    updateAction(`Payment TND ${parseFloat(total).toFixed(2)} processed for ${user.name}`);
                } else {
                    showToast('Error processing payment');
                }
            } catch (error) {
                handleError('Error processing payment', error);
            }
        }

        function renderPayments() {
            const paymentsDiv = document.getElementById('recentPayments');
            
            if (payments.length === 0) {
                paymentsDiv.innerHTML = '<div class="text-center py-8 text-slate-400">No payments processed yet. Click "Process Payment" to get started.</div>';
                return;
            }

            const recentPayments = payments.slice(-5).reverse();
            paymentsDiv.innerHTML = recentPayments.map(payment => `
                <div class="p-4 bg-slate-700 rounded-lg">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-white font-medium">${payment.userName}</div>
                            <div class="text-slate-400 text-sm">${payment.date}</div>
                            <div class="text-slate-300 text-sm mt-1">
                                ${payment.products.map(p => p.name).join(', ')}
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="bg-emerald-600 text-white px-2 py-1 rounded text-sm font-medium">
                                TND ${parseFloat(payment.total).toFixed(2)}
                            </div>
                            <button onclick="removePayment('${payment.id}')" class="p-2 border border-red-600 text-red-400 rounded hover:bg-red-600/20">
                                <i data-lucide="trash-2" class="h-4 w-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function removePayment(paymentId) {
            try {
                const response = await fetch(`/api/payments/${paymentId}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });

                if (response.ok) {
                    await fetchData();
                    updateAction(`Removed payment ${paymentId}`);
                } else {
                    showToast('Error removing payment');
                }
            } catch (error) {
                handleError('Error removing payment', error);
            }
        }

        // Gains analysis
        function updateGainsStats() {
            const totalRevenue = payments.reduce((sum, p) => sum + parseFloat(p.total), 0);
            const totalTransactions = payments.length;
            const averageTransaction = totalTransactions > 0 ? totalRevenue / totalTransactions : 0;

            document.getElementById('totalRevenue').textContent = `TND ${totalRevenue.toFixed(2)}`;
            document.getElementById('totalTransactions').textContent = totalTransactions;
            document.getElementById('averageTransaction').textContent = `TND ${averageTransaction.toFixed(2)}`;
        }

        function updateDailyGains() {
            const selectedDate = document.getElementById('selectedDate').value;
            if (!selectedDate) return;

            const dailyPayments = payments.filter(p => p.date === selectedDate);
            const dailyTotal = dailyPayments.reduce((sum, p) => sum + parseFloat(p.total), 0);

            document.getElementById('gainsDate').textContent = selectedDate;
            document.getElementById('gainsAmount').textContent = `TND ${dailyTotal.toFixed(2)}`;
            document.getElementById('gainsTransactions').textContent = `${dailyPayments.length} transactions`;
            document.getElementById('dailyGainsResult').style.display = 'block';
        }

        // Export functionality
        function exportUsers() {
            const csvContent = ['Name,Email,Phone', ...users.map(u => `${u.name},${u.email},${u.phone}`)].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'users.csv';
            a.click();
            URL.revokeObjectURL(url);
            updateAction('Exported users to CSV');
        }

        function refreshData() {
            renderAll();
            updateAction('Refreshed data');
        }

        function renderAll() {
            renderUsers();
            renderProducts();
            renderPayments();
            renderCoupons();
            updateGainsStats();
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            fetchData();
            lucide.createIcons();
        });
    </script>
</body>
</html>
